[[providers.anthropic.premium]]
model = "claude-sonnet-5"
params = { effort = "high" }

# --- Google Gemini ---------------------------------------------------------------
[[providers.gemini.fast]]
model = "gemini-2.5-flash"
params = { thinking_budget = 0 }

[[providers.gemini.professional]]
model = "gemini-2.5-pro"

[[providers.gemini.professional]]
model = "gemini-2.5-flash"

[[providers.gemini.premium]]
