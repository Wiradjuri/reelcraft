# ReelCraft model catalogue
#
# Maps customer-facing quality tiers to concrete provider models. Update this file (or
# point AI_MODEL_CATALOG_PATH at your own copy) to adopt newer models — no code changes
# are required. The first model in each list is preferred; later entries are fallbacks
# used automatically when the preferred model is unavailable or rate limited.
#
# `params` are passed to the provider adapter (e.g. OpenAI `reasoning_effort`,
# Anthropic `effort`, Gemini `thinking_budget`).
#
# `relative_cost` and `relative_latency` (1 = cheapest/fastest … 5) describe each tier
# and feed the Auto routing policy and usage analytics.

[tiers.fast]
label = "Fast"
relative_cost = 1
relative_latency = 1

[tiers.professional]
label = "Professional"
relative_cost = 3
relative_latency = 3

[tiers.premium]
label = "Premium"
relative_cost = 5
relative_latency = 4

# --- Auto routing policy ----------------------------------------------------------
[auto]
# Score = content complexity (1-3) + 1 if many variations + 1 if long expected output.
# Scores at or below `fast_max_score` use Fast; others use Professional. Auto never
# escalates to Premium on its own — customers opt into Premium explicitly.
fast_max_score = 2
many_variations_threshold = 4
long_output_tokens = 4000

# --- OpenAI ----------------------------------------------------------------------
[[providers.openai.fast]]
model = "gpt-5.4-mini"
params = { reasoning_effort = "low" }

[[providers.openai.fast]]
model = "gpt-5-mini"
params = { reasoning_effort = "low" }

[[providers.openai.professional]]
model = "gpt-5.4"
params = { reasoning_effort = "low" }

[[providers.openai.professional]]
model = "gpt-5.4-mini"
params = { reasoning_effort = "medium" }

[[providers.openai.premium]]
model = "gpt-5.5"
params = { reasoning_effort = "medium" }

[[providers.openai.premium]]
model = "gpt-5.4"
params = { reasoning_effort = "medium" }

# --- Anthropic -------------------------------------------------------------------
[[providers.anthropic.fast]]
model = "claude-haiku-4-5"

[[providers.anthropic.professional]]
model = "claude-sonnet-5"
params = { effort = "medium" }

[[providers.anthropic.professional]]
model = "claude-haiku-4-5"

[[providers.anthropic.premium]]
model = "claude-opus-5"
