# --- OpenRouter ------------------------------------------------------------------
[[providers.openrouter.fast]]
model = "openai/gpt-5.4-mini"

[[providers.openrouter.professional]]
model = "anthropic/claude-sonnet-5"

[[providers.openrouter.premium]]
model = "anthropic/claude-opus-5"

# Local / custom OpenAI-compatible servers have no defaults: the customer picks a model
# in Settings → AI & Integrations → Advanced, and it is used for every tier.
